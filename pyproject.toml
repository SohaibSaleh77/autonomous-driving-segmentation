[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-driving-segmentation"
version = "0.1.0"
description = "PyTorch pipeline for multi-class semantic segmentation using a U-Net architecture on the CamVid dataset."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Learner" }]
license = { text = "MIT" }

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "jupyter"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
